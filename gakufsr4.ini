[FSR4]
; Restart the game after changing this file. 0 disables this plugin.
Enabled=1
; NativeAA, Quality, Balanced, Performance, UltraPerformance
Preset=Quality
Sharpness=0.2
; Native AA only: execute FSR in the Unity TAA pass, before bloom/tonemapping.
; Experimental; default 0 keeps the existing final-pass placement.
NativeAABeforePost=0
; 0 = Unity Halton (1024 phases, default)
; 1 = FSR recommended phases for every preset (8 for Native AA)
; 2 = FSR phases for Native AA only, Unity phases for upscaling
JitterPhaseMode=0
; 1 enables 2x frame generation on compatible swap chains.
FrameGeneration=0
; Experimental AMD-owned SwapChain for D3D11 RGBA8. Requires FrameGeneration=1.
NativeSwapChain=0
