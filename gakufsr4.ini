[FSR4]
; Restart the game after changing this file. 0 disables this plugin.
Enabled=1
; NativeAA, Quality, Balanced, Performance, UltraPerformance
Preset=Quality
Sharpness=0.2
; 0 = Unity Halton (1024 phases, legacy)
; 1 = FSR recommended phases for every preset (8 for Native AA)
; 2 = FSR phases for Native AA only, Unity phases for upscaling (default)
JitterPhaseMode=2
; 1 enables 2x frame generation on compatible swap chains.
; AMD native SwapChain FG requires a single-sample RGBA8 SDR flip-model swap chain.
FrameGeneration=0
